<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="js/i18n.js"></script>
<script src="js/vm-core.js"></script>
</helmet>
<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
<footer dir="{{ dir }}" lang="{{ lang }}" style="font-family:{{ fBody }};line-height:1.5;font-size:15px;color:#1F2933">
  <div style="position:relative;overflow:hidden;background:linear-gradient(180deg,#F5F8FC 0%,#E8EFF8 100%);border-top:1px solid #E1E8F0;isolation:isolate">
    <div aria-hidden="true" style="position:absolute;inset:0;z-index:-3;background:radial-gradient(120% 70% at 0% 100%,rgba(7,89,165,.07),transparent 60%),radial-gradient(90% 60% at 100% 0%,rgba(0,174,239,.06),transparent 60%)"></div>
    <div aria-hidden="true" style="position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(46%,640px);z-index:-3;background-image:radial-gradient(rgba(7,89,165,.16) 1.2px,transparent 1.3px);background-size:11px 11px;-webkit-mask-image:radial-gradient(70% 55% at 60% 25%,#000 0%,transparent 75%);mask-image:radial-gradient(70% 55% at 60% 25%,#000 0%,transparent 75%)"></div>
    <sc-if value="{{ showPlane }}" hint-placeholder-val="{{ true }}">
      <img src="assets/footer/plane.jpg" alt="" aria-hidden="true" style="position:absolute;bottom:0;inset-inline-end:0;width:min(34%,520px);height:auto;z-index:-2;opacity:.32;mix-blend-mode:multiply;filter:grayscale(1) sepia(.25) hue-rotate(180deg) saturate(1.6) brightness(1.15);-webkit-mask-image:radial-gradient(75% 85% at 70% 70%,#000 25%,transparent 72%);mask-image:radial-gradient(75% 85% at 70% 70%,#000 25%,transparent 72%)">
    </sc-if>
    <svg aria-hidden="true" viewBox="0 0 1440 400" preserveAspectRatio="none" style="position:absolute;left:0;right:0;bottom:0;width:100%;height:70%;z-index:-1;pointer-events:none">
      <path d="M0 260 C 360 120, 760 420, 1440 230 L1440 400 L0 400 Z" fill="rgba(255,255,255,.4)"></path>
      <path d="M0 330 C 420 220, 900 420, 1440 300" fill="none" stroke="rgba(7,89,165,.08)" stroke-width="2"></path>
    </svg>

    <div style="max-width:1360px;margin:0 auto;padding:clamp(48px,6vw,80px) clamp(16px,3.5vw,48px) clamp(40px,5vw,64px);display:grid;grid-template-columns:{{ cols }};gap:{{ gap }}">

      <nav aria-label="{{ t.f_quick }}" style="display:flex;flex-direction:column;padding-inline-end:{{ colPad }};border-inline-end:{{ divider }}">
        <h2 style="margin:0 0 26px;font-size:13px;font-weight:700;letter-spacing:{{ hLs }};text-transform:uppercase;color:#0759A5">{{ t.f_quick }}<span style="display:block;width:34px;height:2px;background:#0759A5;margin-top:12px"></span></h2>
        <div style="display:grid;grid-template-columns:{{ navCols }};column-gap:24px">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
            <a href="{{ n.href }}" aria-current="{{ n.current }}" style="display:flex;align-items:center;gap:18px;padding:9px 14px;margin-inline:-14px;border-radius:6px;background:{{ n.bg }};color:#1F2933;text-decoration:none;transition:background .2s,color .2s" style-hover="background:rgba(7,89,165,.07);color:#0759A5">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0759A5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="{{ n.icon }}"></path></svg>
              <span>{{ n.label }}</span>
            </a>
          </sc-for>
        </div>
      </nav>

      <nav aria-label="{{ t.f_cats }}" style="display:flex;flex-direction:column;padding-inline:{{ midPad }};border-inline-end:{{ divider }}">
        <h2 style="margin:0 0 26px;font-size:13px;font-weight:700;letter-spacing:{{ hLs }};text-transform:uppercase;color:#0759A5">{{ t.f_cats }}<span style="display:block;width:34px;height:2px;background:#0759A5;margin-top:12px"></span></h2>
        <sc-for list="{{ eco }}" as="c" hint-placeholder-count="7">
          <a href="{{ c.href }}" style="display:flex;align-items:center;gap:18px;padding-block:9px;color:#1F2933;text-decoration:none;transition:color .2s" style-hover="color:#0759A5">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0759A5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="{{ c.icon }}"></path></svg>
            <span>{{ c.t }}</span>
          </a>
        </sc-for>
      </nav>

      <nav aria-label="{{ t.f_services }}" style="display:flex;flex-direction:column;padding-inline:{{ midPad }};border-inline-end:{{ divider }}">
        <h2 style="margin:0 0 26px;font-size:13px;font-weight:700;letter-spacing:{{ hLs }};text-transform:uppercase;color:#0759A5">{{ t.f_services }}<span style="display:block;width:34px;height:2px;background:#0759A5;margin-top:12px"></span></h2>
        <sc-for list="{{ svcs }}" as="sv" hint-placeholder-count="5">
          <a href="{{ sv.href }}" style="display:flex;align-items:center;gap:18px;padding-block:10px;color:#1F2933;text-decoration:none;transition:color .2s" style-hover="color:#0759A5">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0759A5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="{{ sv.icon }}"></path></svg>
            <span>{{ sv.title }}</span>
          </a>
        </sc-for>
      </nav>

      <div style="display:flex;flex-direction:column;padding-inline-start:{{ colPad }}">
        <h2 style="margin:0 0 26px;font-size:13px;font-weight:700;letter-spacing:{{ hLs }};text-transform:uppercase;color:#0759A5">{{ t.f_contact }}<span style="display:block;width:34px;height:2px;background:#0759A5;margin-top:12px"></span></h2>
        <div style="display:flex;align-items:flex-start;gap:18px;padding-bottom:20px;border-bottom:1px solid rgba(7,89,165,.14);margin-bottom:12px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#0759A5" aria-hidden="true" style="flex-shrink:0;margin-top:2px"><path d="M12 22s7-6.4 7-12.2A7 7 0 0 0 5 9.8C5 15.6 12 22 12 22Zm0-9.3a2.8 2.8 0 1 1 0-5.6 2.8 2.8 0 0 1 0 5.6Z"></path></svg>
          <address style="font-style:normal;line-height:1.65;max-width:34ch">{{ t.addr }}</address>
        </div>
        <a href="tel:+971509259286" style="display:flex;align-items:center;gap:18px;padding-block:8px;color:#1F2933;text-decoration:none" style-hover="color:#0759A5">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#0759A5" aria-hidden="true" style="flex-shrink:0"><path d="{{ phone }}"></path></svg>
          <span dir="ltr" style="unicode-bidi:isolate">+971 50 925 9286</span>
        </a>
        <a href="tel:+971509155899" style="display:flex;align-items:center;gap:18px;padding-block:8px;color:#1F2933;text-decoration:none" style-hover="color:#0759A5">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#0759A5" aria-hidden="true" style="flex-shrink:0"><path d="{{ phone }}"></path></svg>
          <span dir="ltr" style="unicode-bidi:isolate">+971 50 915 5899</span>
        </a>
        <a href="mailto:info@velmachaerospace.com" style="display:flex;align-items:center;gap:18px;padding-block:8px;color:#0759A5;text-decoration:underline;text-underline-offset:4px" style-hover="color:#0B1B2B">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink:0"><rect x="2" y="4.5" width="20" height="15" rx="1.5" fill="#0759A5"></rect><path d="M4.5 7.5 12 13l7.5-5.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span dir="ltr" style="unicode-bidi:isolate;overflow-wrap:anywhere">info@velmachaerospace.com</span>
        </a>
        <a href="mailto:sales@velmachaerospace.com" style="display:flex;align-items:center;gap:18px;padding-block:8px;color:#0759A5;text-decoration:underline;text-underline-offset:4px" style-hover="color:#0B1B2B">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink:0"><rect x="2" y="4.5" width="20" height="15" rx="1.5" fill="#0759A5"></rect><path d="M4.5 7.5 12 13l7.5-5.5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span dir="ltr" style="unicode-bidi:isolate;overflow-wrap:anywhere">sales@velmachaerospace.com</span>
        </a>
      </div>
    </div>
  </div>

  <!-- bottom bar: navy, runway photo faded into the centre -->
  <div style="position:relative;overflow:hidden;background:linear-gradient(90deg,#0D2440 0%,#143A66 50%,#0D2440 100%);color:#D5DFEA;font-size:14px;isolation:isolate">
    <sc-if value="{{ notSm }}" hint-placeholder-val="{{ true }}">
      <img src="assets/footer/bar.jpg" alt="" aria-hidden="true" style="position:absolute;top:50%;left:50%;width:min(52%,720px);height:auto;transform:translate(-50%,-56%);z-index:-1;opacity:.85;mix-blend-mode:screen;filter:sepia(.55) saturate(1.5) hue-rotate(-12deg) contrast(1.1);-webkit-mask-image:radial-gradient(50% 60% at 50% 55%,#000 30%,transparent 100%);mask-image:radial-gradient(50% 60% at 50% 55%,#000 30%,transparent 100%)">
    </sc-if>
    <div aria-hidden="true" style="position:absolute;inset:0;z-index:-1;background:radial-gradient(40% 120% at 50% 100%,rgba(255,170,90,.18),transparent 70%)"></div>
    <div style="padding:16px clamp(16px,2.5vw,32px) 4px;padding-right:92px;display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap">
      <span style="display:inline-flex;align-items:center;gap:10px;font-weight:700;color:#FFFFFF">
        <img src="assets/img/velmach-logo.png" alt="" aria-hidden="true" width="1432" height="800" loading="lazy" style="height:40px;width:auto;display:block;filter:brightness(0) invert(1)">
        {{ t.f_legal }}
      </span>
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <button type="button" onClick="{{ toggleLang }}" aria-label="{{ t.lang_aria }}" style="display:inline-flex;align-items:center;gap:10px;height:44px;padding-inline:18px;background:rgba(7,17,29,.35);border:1px solid rgba(255,255,255,.35);border-radius:4px;color:#FFFFFF;font-family:{{ fAlt }};font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s" style-hover="background:rgba(255,255,255,.12);border-color:#FFFFFF">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20ZM2 12h20M12 2c2.8 3 2.8 17 0 20M12 2c-2.8 3-2.8 17 0 20"></path></svg>
          {{ t.lang_btn }}
        </button>
        <span dir="ltr" style="display:inline-flex;align-items:center;gap:12px;padding-inline-start:20px;border-inline-start:1px solid rgba(255,255,255,.25)">
          <span style="color:#D5DFEA;font-size:14px">Powered By</span>
          <a href="https://www.dripfunnel.com/in/" target="_blank" rel="noopener" aria-label="DripFunnel" style="display:inline-flex;align-items:center;text-decoration:none">
            <sc-if value="{{ pbImg }}" hint-placeholder-val="{{ true }}">
              <img src="assets/dripfunnel/DRIPFUNNEL%20white%20logo.png" alt="DripFunnel" onError="{{ pbErr }}" loading="lazy" style="height:26px;width:auto;display:block">
            </sc-if>
            <sc-if value="{{ pbText }}" hint-placeholder-val="{{ false }}">
              <span style="color:#FFFFFF;font-size:18px;font-weight:800">DripFunnel</span>
            </sc-if>
          </a>
        </span>
      </div>
    </div>
  </div>
</footer>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: false, pbFail: false };
  componentDidMount() {
    const go = () => { if (window.VM && window.VM_I18N) { this.unsub = window.VM.subscribe(() => this.forceUpdate()); this.setState({ ready: true }); } else this.tw = setTimeout(go, 30); };
    go();
  }
  componentWillUnmount() { clearTimeout(this.tw); this.unsub && this.unsub(); }
  renderVals() {
    if (!this.state.ready) return { ready: false };
    const VM = window.VM, t = VM.t(), v = VM.sv();
    const file = (typeof location !== 'undefined' ? location.pathname.split('/').pop() : '') || 'index.html';
    const cur = VM.PAGES.find(k => VM.HREF[k] === file) || (file === 'product.dc.html' ? 'products' : file === 'blog.dc.html' ? 'blog' : '');
    const recycle = 'M7 19H4.8a1.8 1.8 0 0 1-1.6-2.7l4-6.8M11 19h8.2a1.8 1.8 0 0 0 1.6-2.7l-1.2-2M14 16l-3 3 3 3M8.3 13.6 7.2 9.5l-4.1 1.1M9.3 5.6l1.1-1.9a1.8 1.8 0 0 1 3.1 0l3.9 6.7M13.4 10.4l3.9-1.1 1.1 4.1';
    const box = 'M12 2 3 7v10l9 5 9-5V7l-9-5ZM3 7l9 5 9-5M12 12v10';
    // Line icons, 24px grid
    const I = {
      home: 'M3 10.5 12 3l9 7.5M5 9v12h5v-6h4v6h5V9',
      about: 'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20ZM12 11v6M12 7.5v.01',
      products: box,
      industries: 'M3 21V10l5 3v-3l5 3v-3l5 3V3h3v18ZM7 17h1M11 17h1M15 17h1',
      services: 'M12 8.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7ZM12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8',
      quality: 'M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3ZM8.5 12l2.5 2.5 4.5-5',
      blog: 'M5 3h10l4 4v14H5ZM15 3v4h4M8 11h8M8 15h8M8 19h5',
      contact: 'M3 5h18v14H3ZM3 6l9 7 9-7',
      parts: 'M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2Z',
      lubchem: 'M9 3h6M10 3v6L4.2 18.8A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.3-2.2L14 9V3M7 15h10',
      materials: 'M12 3 2 8l10 5 10-5-10-5ZM2 12.5l10 5 10-5M2 17l10 5 10-5',
      oilgas: 'M4 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17M3 21h12M7 7h4v4H7ZM14 9h2l3 3v6a1.5 1.5 0 0 0 3 0V9l-3-3',
      used: recycle,
      petro: 'M6 3h12M6 21h12M7 3c-1.3 3-1.3 15 0 18M17 3c1.3 3 1.3 15 0 18M6.5 8h11M6.5 16h11',
      consult: 'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9Z',
      s_aog: 'M3 14v-2a9 9 0 0 1 18 0v2M3 14h3v6H4a1 1 0 0 1-1-1ZM21 14h-3v6h2a1 1 0 0 0 1-1ZM18 20c0 1.2-1.2 2-3 2h-2',
      s_sourcing: 'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20ZM2 12h20M12 2c2.8 3 2.8 17 0 20M12 2c-2.8 3-2.8 17 0 20',
      s_logistics: 'M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4',
      s_used: recycle,
      s_consult: 'M9 11a3.5 3.5 0 1 0 0-7a3.5 3.5 0 1 0 0 7ZM2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.2a3.5 3.5 0 0 1 0 6.6M18 14.3c2 .8 3.5 2.8 3.5 5.7'
    };
    return { ...v, ready: true, t,
      fAlt: v.ar ? "'Archivo', system-ui, sans-serif" : "'IBM Plex Sans Arabic', Tahoma, sans-serif",
      toggleLang: () => VM.toggleLang(),
      pbImg: !this.state.pbFail, pbText: this.state.pbFail, pbErr: () => this.setState({ pbFail: true }),
      showPlane: v.lg, navCols: v.sm ? 'repeat(2,minmax(0,1fr))' : 'minmax(0,1fr)', hLs: v.ar ? '0' : '.24em',
      cols: v.lg ? 'minmax(0,.8fr) minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,1.2fr)' : v.md ? 'repeat(2,minmax(0,1fr))' : 'minmax(0,1fr)',
      gap: v.lg ? '0' : '40px 32px',
      divider: v.lg ? '1px solid rgba(7,89,165,.12)' : '0',
      colPad: v.lg ? 'clamp(24px,3vw,56px)' : '0', midPad: v.lg ? 'clamp(24px,3vw,56px)' : '0',
      phone: 'M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8Z',
      nav: VM.PAGES.filter(k => k !== 'blog').map(k => ({ href: VM.HREF[k], label: t.nav[k], icon: I[k] || box,
        current: cur === k ? 'page' : undefined, bg: cur === k ? 'rgba(7,89,165,.08)' : 'transparent' })),
      eco: t.eco.map(c => ({ ...c, href: 'products.dc.html?cat=' + c.cat, icon: I[c.id] || box })),
      svcs: t.services.map(s => ({ title: s.title, href: 'services.dc.html#svc-' + s.id, icon: I['s_' + s.id] || box })) };
  }
}
</script>
</body>
</html>
